algo: PPO

ppo:
  output_name: 'lstm_teacher_bin_task_packing'
  num_actors: ${...task.env.numEnvs}
  
  normalize_input: True
  normalize_advantage: True
  normalize_value: True
  value_bootstrap: True

  grad_norm: 1.0
  entropy_coef: 0.0
  truncate_grads: True
  e_clip: 0.2
  critic_coef: 2
  clip_value: True
  tau: 0.95
  gamma: 0.99
  bounds_loss_coef: 0.0 # 0.0001

  learning_rate: 1.0e-4
  lr_schedule_actor: 'adaptive' # 'adaptive' or 'fixed'
  kl_threshold_actor: 0.002 # 0.02
  lr_schedule_critic: 'adaptive' # 'adaptive' or 'fixed'
  kl_threshold_critic: 0.002
  max_lr: 1.0e-2

  seq_length: 128
  horizon_length: 256 # 512 means we run episodes twice per env
  minibatch_size: 1024 # 16384: we could use higher mb size but less gradient steps
  mini_epochs_actor: 4
  mini_epochs_critic: 4

  save_frequency: 100
  save_best_after: 50
  max_agent_steps: 3000000000

# we have 15 books in bookshelf including goal
actor:
  actions_num: 6
  normalization: None
  teacher: True
  input_shape:
    ee_pos: [3]
    ee_quat: [4]
    insertion_object_pos: [3]
    insertion_object_quat: [4]
    insertion_object_left_elastomer_force: [3]
    insertion_object_right_elastomer_force: [3]
    dof_pos: [9]
    ee_lin_vel: [3]
    ee_ang_vel: [3]
    insertion_object_linvel: [3]
    insertion_object_angvel: [3]
    goal_pos: [3]
    goal_quat: [4]
    # packed_object_pose: [126] # ((4 quat) + (3 pos)) x (19 objects - 1 to not include goal)
    # packed_object_vel: [108] # (3 lin vel + 3 ang vel) x (19 objects - 1 to not include goal)
    # insertion_object_bin_packed_force: [57] # (3 forces) x (19 objects)
    packed_object_pose: [98] # ((4 quat) + (3 pos)) x (15 objects - 1 to not include goal)
    packed_object_vel: [84] # (3 lin vel + 3 ang vel) x (15 objects - 1 to not include goal)
    insertion_object_bin_packed_force: [45] # (3 forces) x (15 objects)

  input_preprocessors:
    ee_pos: {}
    ee_quat: {}
    insertion_object_pos: {}
    insertion_object_quat: {}
    insertion_object_left_elastomer_force: {}
    insertion_object_right_elastomer_force: {}
    dof_pos: {}
    ee_lin_vel: {}
    ee_ang_vel: {}
    insertion_object_linvel: {}
    insertion_object_angvel: {}
    goal_pos: {}
    goal_quat: {}
    packed_object_pose: {}
    packed_object_vel: {}
    insertion_object_bin_packed_force: {}

  mlp:
    units: [512, 128, 64]
    activation: elu
    d2rl: false
    initializer:
      name: default
    regularizer:
      name: None
  rnn:
    name: lstm
    units: 256
    layers: 2
    before_mlp: True
    concat_input: True
    layer_norm: True
  space:
    continuous:
      mu_activation: None
      sigma_activation: None
      mu_init:
        name: default
      sigma_init:
        name: const_initializer
        val: 0.0
      fixed_sigma: True

critic:
  value_size: 1
  value_activation: None
  freeze_critic: False
  teacher: True

  normalize_input: True
  input_shape:
    ee_pos: [3]
    ee_quat: [4]
    insertion_object_pos: [3]
    insertion_object_quat: [4]
    insertion_object_left_elastomer_force: [3]
    insertion_object_right_elastomer_force: [3]
    dof_pos: [9]
    ee_lin_vel: [3]
    ee_ang_vel: [3]
    insertion_object_linvel: [3]
    insertion_object_angvel: [3]
    goal_pos: [3]
    goal_quat: [4]
    # packed_object_pose: [126] # ((4 quat) + (3 pos)) x (19 objects - 1 to not include goal)
    # packed_object_vel: [108] # (3 lin vel + 3 ang vel) x (19 objects - 1 to not include goal)
    # insertion_object_bin_packed_force: [57] # (3 forces) x (19 objects)
    packed_object_pose: [98] # ((4 quat) + (3 pos)) x (15 objects - 1 to not include goal)
    packed_object_vel: [84] # (3 lin vel + 3 ang vel) x (15 objects - 1 to not include goal)
    insertion_object_bin_packed_force: [45] # (3 forces) x (15 objects)

  input_preprocessors:
    ee_pos: {}
    ee_quat: {}
    insertion_object_pos: {}
    insertion_object_quat: {}
    insertion_object_left_elastomer_force: {}
    insertion_object_right_elastomer_force: {}
    dof_pos: {}
    ee_lin_vel: {}
    ee_ang_vel: {}
    insertion_object_linvel: {}
    insertion_object_angvel: {}
    goal_pos: {}
    goal_quat: {}
    packed_object_pose: {}
    packed_object_vel: {}
    insertion_object_bin_packed_force: {}

  mlp:
    units: [512, 128, 64]
    activation: elu
    d2rl: false
    initializer:
      name: default
    regularizer:
      name: None
  rnn:
    name: lstm
    units: 256
    layers: 2
    before_mlp: True
    concat_input: True
    layer_norm: True