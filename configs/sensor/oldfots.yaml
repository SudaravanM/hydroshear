# FOTS Sensor Configuration
# This config file contains parameters for the HydroFOTS tactile sensor simulation

# Lambda parameters for force field calculation
lambda_d: 0.000005  # lambda for dilation force calculation
lambda_s: 3.08307  # lambda for shear force calculation
lambda_t: 0.71568  # lambda for twist force calculation

# Scale factors
dilate_scale: ${eval:"1000 / 0.0634 * 1"} # 1000 [mm/m] / 0.065 [mm/px] = 15384.615 [px/m]
shear_scale: ${eval:"1000 / 0.0634 * 1"}
twist_scale: ${eval:"1000 / 0.0634 * 1"}

randomize_coefficients: False
randomize_every_step: False
randomize_every_episode: False